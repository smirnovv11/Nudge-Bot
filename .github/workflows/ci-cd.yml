name: CI/CD

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nudge-bot

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Build Docker image
        run: docker build --tag nudge-bot:ci .

  deploy:
    name: Build and deploy
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Northflank bot deployment
        env:
          NORTHFLANK_BOT_DEPLOY_HOOK_URL: ${{ secrets.NORTHFLANK_BOT_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$NORTHFLANK_BOT_DEPLOY_HOOK_URL" ]; then
            curl --fail --request POST "$NORTHFLANK_BOT_DEPLOY_HOOK_URL"
          fi

      - name: Trigger Northflank worker deployment
        env:
          NORTHFLANK_WORKER_DEPLOY_HOOK_URL: ${{ secrets.NORTHFLANK_WORKER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$NORTHFLANK_WORKER_DEPLOY_HOOK_URL" ]; then
            curl --fail --request POST "$NORTHFLANK_WORKER_DEPLOY_HOOK_URL"
          fi
